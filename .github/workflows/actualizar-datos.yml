name: Actualización diaria desde Google Drive

on:
  schedule:
    - cron: '25 12 * * *'   # 06:25 h, hora del centro de México
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install openpyxl xlrd google-api-python-client google-auth
      - name: Descargar y procesar los reportes del día
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVESAJSON || secrets.GDRIVE_SA_JSON }}
        run: python scripts/actualizar_desde_drive.py
      - name: Publicar los datos
        run: |
          git config user.name "Agente Tablero PAA 2027"
          git config user.email "noreply@anthropic.com"
          git add datos/
          if git diff --cached --quiet; then echo "Sin cambios en datos/"; exit 0; fi
          CORTE=$(python -c "import json;b=json.load(open('datos/bitacora.json'));c=[r['fecha_corte'] for r in b['reportes'] if r.get('estado')=='actualizado'];print(max(c) if c else '')")
          if [ -n "$CORTE" ]; then F=$(python -c "import sys;y,m,d='$CORTE'.split('-');print(f'{d}/{m}/{y}')"); MSG="Datos PAA 2027 · corte $F"; else MSG="Bitácora de actualización PAA 2027"; fi
          git commit -m "$MSG" -m "$(python -c "import json;b=json.load(open('datos/bitacora.json'));print('\n'.join(r['reporte']+': '+r.get('archivo','—')+' · '+r['estado'] for r in b['reportes']+b['pendientes']))")"
          git push
